# Embedded by qa-guru/cm for `cm selenoid start --pool` (alias `--warm-pool`).
# Snapshot of selenoid-pool docker-compose.hub.yml: warm 4/4 + orchestrator.
# Pull published image qaguru/selenoid-pool:min (no local Dockerfile).
# `--hot-pool` → compose profile `hot` (same orchestrator, not a third binary).
name: selenoid-warm
services:
  warm-chrome-1:
    image: qaguru/webdriver-chrome:149
    container_name: warm-chrome-1
    restart: unless-stopped
    environment:
      WARM_SLOT_ID: pool-chrome-1
      WARM_SESSION_ID: pool-chrome-1
      ENABLE_VNC: "true"
    ports:
      - "127.0.0.1:14441:4444"
    shm_size: "2gb"
    tmpfs:
      - /tmp:size=512m
    networks:
      - selenoid-warm

  warm-chrome-2:
    image: qaguru/webdriver-chrome:149-min
    container_name: warm-chrome-2
    restart: unless-stopped
    environment:
      WARM_SLOT_ID: pool-chrome-2
      WARM_SESSION_ID: pool-chrome-2
    ports:
      - "127.0.0.1:14442:4444"
    shm_size: "2gb"
    tmpfs:
      - /tmp:size=512m
    networks:
      - selenoid-warm

  warm-pw-1:
    image: qaguru/playwright-chromium:1.61.1
    container_name: warm-pw-1
    restart: unless-stopped
    environment:
      WARM_SLOT_ID: pool-pw-chromium-1
      WARM_SESSION_ID: pool-pw-chromium-1
      ENABLE_VNC: "true"
    ports:
      - "127.0.0.1:14501:3000"
    shm_size: "2gb"
    tmpfs:
      - /tmp:size=512m
    networks:
      - selenoid-warm

  warm-pw-min-1:
    image: qaguru/playwright-chromium:1.61.1-min
    container_name: warm-pw-min-1
    restart: unless-stopped
    environment:
      WARM_SLOT_ID: pool-pw-chromium-min-1
      WARM_SESSION_ID: pool-pw-chromium-min-1
    ports:
      - "127.0.0.1:14502:3000"
    shm_size: "2gb"
    tmpfs:
      - /tmp:size=512m
    networks:
      - selenoid-warm

  hot-chrome-min-1:
    profiles: ["hot"]
    image: qaguru/webdriver-chrome:149-min
    container_name: hot-chrome-min-1
    restart: unless-stopped
    environment:
      WARM_SLOT_ID: pool-hot-chrome-min-1
      WARM_SESSION_ID: pool-hot-chrome-min-1
    ports:
      - "127.0.0.1:16440:4444"
    shm_size: "2gb"
    tmpfs:
      - /tmp:size=512m
    networks:
      - selenoid-warm

  hot-pw-min-1:
    profiles: ["hot"]
    image: qaguru/playwright-chromium:1.61.1-min
    container_name: hot-pw-min-1
    restart: unless-stopped
    environment:
      WARM_SLOT_ID: pool-hot-pw-min-1
      WARM_SESSION_ID: pool-hot-pw-min-1
    ports:
      - "127.0.0.1:16441:3000"
    shm_size: "2gb"
    tmpfs:
      - /tmp:size=512m
    networks:
      - selenoid-warm

  orchestrator:
    image: qaguru/selenoid-pool:min
    container_name: selenoid-pool
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      WARM_POOL_CONFIG: /config/config.yaml
      WARM_POOL_HOST: "0.0.0.0"
      WARM_POOL_PORT: "9090"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    networks:
      selenoid-warm:
        aliases:
          - selenoid-warm-pool
    depends_on:
      - warm-chrome-1
      - warm-chrome-2
      - warm-pw-1
      - warm-pw-min-1

networks:
  selenoid-warm:
    name: selenoid-warm
    driver: bridge
