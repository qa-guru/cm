# Пример nginx для selenoid.autotests.cloud
# Скопировать в /etc/nginx/sites-available/selenoid и включить site.
#
# htpasswd (один раз):
#   sudo htpasswd -cb /etc/nginx/selenoid.htpasswd user1 1234
#   sudo chmod 640 /etc/nginx/selenoid.htpasswd
#   sudo chown root:www-data /etc/nginx/selenoid.htpasswd
#
# Проверка и reload:
#   sudo nginx -t && sudo systemctl reload nginx

upstream selenoid_hub {
    server 127.0.0.1:4444;
}

server {
    listen 443 ssl http2;
    server_name selenoid.autotests.cloud;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    # Публичный status (без auth) — опционально
    location = /status {
        proxy_pass http://selenoid_hub;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebDriver — basic auth
    location /wd/hub {
        auth_basic "Selenoid";
        auth_basic_user_file /etc/nginx/selenoid.htpasswd;

        proxy_pass http://selenoid_hub;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Playwright WebSocket — тот же basic auth, что и /wd/hub
    location /playwright/ {
        auth_basic "Selenoid";
        auth_basic_user_file /etc/nginx/selenoid.htpasswd;

        proxy_pass http://selenoid_hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Видео и остальное hub API — по желанию с auth или без
    location /video/ {
        proxy_pass http://selenoid_hub;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://selenoid_hub;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
