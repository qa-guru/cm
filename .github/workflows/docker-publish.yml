# DEPRECATED (GHA-006): tagged images via release.yml. Manual emergency republish only.
name: docker-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image tag (e.g. v2.0.5 or latest-release)'
        required: true
        default: 'v2.1.0'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.27.0+auto
    steps:
      - uses: actions/checkout@v7

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: ci/build.sh

      - name: Push Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: ci/docker-push.sh "${{ inputs.version }}"
