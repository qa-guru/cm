name: deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Stack release tag (e.g. v2.0.1). Empty = latest GitHub release'
        required: false
        default: ''
  repository_dispatch:
    types: [deploy-selenoid]

concurrency:
  group: selenoid-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: selenoid-production
    steps:
      - uses: actions/checkout@v5

      - name: Resolve stack version and script ref
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "ref=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.client_payload.version }}" ]]; then
            echo "tag=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SELENOID_DEPLOY_HOST }}
          username: ${{ secrets.SELENOID_DEPLOY_USER }}
          key: ${{ secrets.SELENOID_DEPLOY_KEY }}
          script_stop: false
          script: |
            set -euo pipefail
            export SELENOID_VERSION="${{ steps.meta.outputs.tag }}"
            export SELENOID_CONFIG_DIR="${{ vars.SELENOID_CONFIG_DIR }}"
            export SELENOID_CONFIG_DIR="${SELENOID_CONFIG_DIR:-/opt/selenoid}"
            export CM_BIN="$HOME/cm"
            curl -fsSL "https://raw.githubusercontent.com/qa-guru/cm/${{ github.sha }}/deploy/nginx-selenoid.conf" -o /tmp/nginx-selenoid.conf
            curl -fsSL "https://raw.githubusercontent.com/qa-guru/cm/${{ github.sha }}/deploy/sync-nginx.sh" -o /tmp/sync-nginx.sh
            chmod +x /tmp/sync-nginx.sh
            export NGINX_CONF_SRC=/tmp/nginx-selenoid.conf
            export NGINX_SYNC_SCRIPT=/tmp/sync-nginx.sh
            curl -fsSL "https://raw.githubusercontent.com/qa-guru/cm/${{ github.sha }}/deploy/browsers-production.json" -o /tmp/browsers-production.json
            curl -fsSL "https://raw.githubusercontent.com/qa-guru/cm/${{ github.sha }}/deploy/deploy.sh" -o /tmp/deploy-selenoid.sh
            chmod +x /tmp/deploy-selenoid.sh
            bash /tmp/deploy-selenoid.sh

      - name: Smoke test (public)
        env:
          SELENOID_USER: user1
          SELENOID_PASSWORD: "1234"
          SELENOID_PUBLIC_URL: ${{ vars.SELENOID_PUBLIC_URL }}
        run: |
          chmod +x deploy/smoke-remote.sh
          BASE="${SELENOID_PUBLIC_URL:-https://selenoid.autotests.cloud}"
          ./deploy/smoke-remote.sh "$BASE"
