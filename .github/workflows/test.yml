name: test

on:
  pull_request:

jobs:
  golang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: ~1.23.8
          cache: true

      - name: Test
        run: ci/test.sh

      - name: Build
        run: ci/build.sh
